name: Release Implementation
on:
  workflow_call:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" -type d | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          swift --version

      - name: Validate bump input
        run: |
          case "${{ inputs.bump }}" in
            patch|minor|major) ;;
            *) echo "Invalid bump value: '${{ inputs.bump }}'. Must be patch, minor, or major." >&2; exit 1 ;;
          esac

      - name: Bump version
        id: version
        run: |
          MARKETING_VERSION=$(grep '^MARKETING_VERSION=' version.env | cut -d= -f2)
          BUILD_NUMBER=$(grep '^BUILD_NUMBER=' version.env | cut -d= -f2)
          IFS='.' read -r major minor patch <<< "$MARKETING_VERSION"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          NEW_VERSION="${major}.${minor}.${patch}"
          NEW_BUILD=$((BUILD_NUMBER + 1))

          echo "MARKETING_VERSION=${NEW_VERSION}" > version.env
          echo "BUILD_NUMBER=${NEW_BUILD}" >> version.env

          python3 -c "
          import plistlib, pathlib
          p = pathlib.Path('Sources/KeepAwake/Resources/Info.plist')
          plist = plistlib.loads(p.read_bytes())
          plist['CFBundleShortVersionString'] = '${NEW_VERSION}'
          plist['CFBundleVersion'] = '${NEW_BUILD}'
          p.write_bytes(plistlib.dumps(plist))
          "

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${NEW_BUILD}" >> "$GITHUB_OUTPUT"
          echo "Bumped to v${NEW_VERSION} (build ${NEW_BUILD})"

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test --parallel

      - name: Bundle app
        run: |
          mkdir -p KeepAwake.app/Contents/MacOS KeepAwake.app/Contents/Resources
          cp .build/release/KeepAwake KeepAwake.app/Contents/MacOS/
          cp Sources/KeepAwake/Resources/Info.plist KeepAwake.app/Contents/
          cp Icon.icns KeepAwake.app/Contents/Resources/AppIcon.icns 2>/dev/null || true
          codesign --force --deep --sign - KeepAwake.app

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="KeepAwake-v${VERSION}.dmg"
          DMG_DIR=$(mktemp -d)
          cp -r KeepAwake.app "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create -volname "KeepAwake" -srcfolder "$DMG_DIR" -ov -format UDZO "$DMG_NAME"
          rm -rf "$DMG_DIR"

          SHA=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          echo "dmg_name=${DMG_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "SHA-256: ${SHA}"

      - name: Commit version bump
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.env Sources/KeepAwake/Resources/Info.plist
          git commit -m "chore(release): bump version to ${VERSION}"
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Create GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.dmg.outputs.sha256 }}"
          NOTES="### Install"$'\n'"brew install --cask yashiels/tap/keepawake"$'\n\n'"Or download the DMG below."$'\n\n'"**SHA-256:** ${SHA}"
          gh release create "v${VERSION}" \
            "${{ steps.dmg.outputs.dmg_name }}" \
            --title "KeepAwake v${VERSION}" \
            --generate-notes \
            --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap (signed commit)
        env:
          # HOMEBREW_TAP_TOKEN is owned by a bypass user, so createCommitOnBranch
          # lands a GitHub-signed ("Verified") commit that also satisfies the
          # tap's branch ruleset — unlike a plain github-actions[bot] git push.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.dmg.outputs.sha256 }}"
          TAP="yashiels/homebrew-tap"
          BRANCH="main"

          CASK_FILE=$(mktemp)
          python3 -c "
          v, s = '${VERSION}', '${SHA}'
          cask = f'''cask \"keepawake\" do
            version \"{v}\"
            sha256 \"{s}\"

            url \"https://github.com/yashiels/keep-awake/releases/download/v#{{version}}/KeepAwake-v#{{version}}.dmg\"
            name \"KeepAwake\"
            desc \"Menu bar app to prevent Jamf-managed macOS screen lock\"
            homepage \"https://github.com/yashiels/keep-awake\"

            app \"KeepAwake.app\"

            postflight do
              system_command \"/usr/bin/xattr\", args: [\"-cr\", \"#{{appdir}}/KeepAwake.app\"]
            end

            zap trash: [
              \"~/Library/Preferences/com.yashiels.KeepAwake.plist\",
            ]
          end
          '''
          import textwrap
          open('${CASK_FILE}', 'w').write(textwrap.dedent(cask).lstrip())
          "

          b64=$(base64 < "$CASK_FILE" | tr -d '\n')

          # Commits created through the GraphQL API are GPG-signed by GitHub's
          # web-flow key and land as "Verified". Retry on a stale expectedHeadOid
          # in case the tap branch moves between the ref read and the mutation.
          for attempt in 1 2 3 4 5; do
            oid=$(gh api "repos/${TAP}/git/ref/heads/${BRANCH}" --jq '.object.sha')
            payload=$(jq -n \
              --arg repo "$TAP" --arg branch "$BRANCH" --arg oid "$oid" \
              --arg headline "keepawake: update cask for v${VERSION}" \
              --arg path "Casks/keepawake.rb" --arg c "$b64" \
              '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
                variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, expectedHeadOid: $oid, message: {headline: $headline}, fileChanges: {additions: [{path: $path, contents: $c}]}}}}')
            if out=$(printf '%s' "$payload" | gh api graphql --input - 2>&1); then
              url=$(printf '%s' "$out" | jq -r '.data.createCommitOnBranch.commit.url // empty')
              if [ -n "$url" ]; then echo "Homebrew tap updated (verified): $url"; exit 0; fi
              echo "attempt $attempt: no commit in response: $out"
            else
              echo "attempt $attempt failed: $out"
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to update Homebrew tap after retries" >&2
          exit 1

      - name: Upload DMG artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: ${{ steps.dmg.outputs.dmg_name }}
          path: ${{ steps.dmg.outputs.dmg_name }}
